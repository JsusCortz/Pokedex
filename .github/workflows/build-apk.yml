name: Build Android APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    name: Compilar APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar Java JDK (v17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar dependencias de Capacitor
        run: npm install

      - name: Preparar carpeta web
        run: npm run prepare-www

      - name: Inicializar plataforma Android
        run: npx cap add android

      - name: Sincronizar proyecto Android
        run: npx cap sync android

      - name: Dar permisos de ejecución a Gradlew
        run: chmod +x android/gradlew

      - name: Compilar APK (Debug)
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Subir APK como Artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: Pokedex-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
