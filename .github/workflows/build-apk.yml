name: Build Android APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compilar APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configurar Java JDK (v17)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Instalar dependencias de Capacitor
        run: npm install

      - name: Preparar carpeta web
        run: npm run prepare-www

      - name: Inicializar plataforma Android
        run: npx cap add android

      - name: Sincronizar proyecto Android
        run: npx cap sync android

      - name: Dar permisos de ejecución a Gradlew
        run: chmod +x android/gradlew

      - name: Compilar APK (Debug)
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Renombrar APK a Pokedex.apk
        run: |
          mv android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/Pokedex.apk

      - name: Publicar instalable directo (.apk) en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Pokédex v1.0.${{ github.run_number }}"
          body: |
            ### 📱 Pokédex Android
            Descarga e instala directamente el archivo **Pokedex.apk** en tu teléfono sin descomprimir.
          files: android/app/build/outputs/apk/debug/Pokedex.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
